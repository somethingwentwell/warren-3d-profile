<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<body>

<!-- ══ STAGE — content rendered from js/config.js by js/render.js ══ -->
<header class="stage" id="stage">
  <div class="stage__view">
    <canvas id="avatar-canvas" aria-label="Low-poly 3D avatar of Warren Wong"></canvas>
    <nav class="hud hud--left" aria-label="Contact" id="contact-nav">
      <p class="hud__label">contact</p>
    </nav>
    <nav class="hud hud--right" aria-label="Past experience" id="pastexp-nav">
      <p class="hud__label">past_exp</p>
    </nav>
  </div>

  <div class="hud hud--tl edge-item" id="nameplate"></div>
  <a class="hud hud--tr edge-item sales-card" target="_blank" rel="noopener" id="sales-link"></a>
  <div class="hud hud--bottom" id="bottom-strip"></div>

  <div class="toast" id="toast" role="status"></div>
</header>

<main>
  <section class="section" id="experience">
    <h2 class="section__title"><span>01</span> Full-time Experience</h2>
    <div id="xp-list"></div>
  </section>

  <section class="section" id="other-exp">
    <h2 class="section__title"><span>02</span> Other Experience</h2>
    <div class="mini-grid" id="mini-list"></div>
  </section>

  <section class="section" id="skills">
    <h2 class="section__title"><span>03</span> Skills &amp; Credentials</h2>
    <div class="skill-grid" id="skill-grid"></div>
    <div class="cred-cols" id="cred-cols"></div>
  </section>
</main>

<footer class="footer" id="footer"></footer>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
